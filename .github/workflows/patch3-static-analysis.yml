name: PATCH3 Static Analysis

on:
  push:
    branches:
      - main
    paths:
      - 'packages/phase3c_hardening_20261023/contracts/**'
      - '.github/workflows/patch3-static-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Solidity dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @openzeppelin/contracts@5.5.0

      - name: Install pinned Slither and solc
        run: |
          python3 -m pip install --disable-pip-version-check --quiet slither-analyzer==0.11.3
          solc-select install 0.8.26
          solc-select use 0.8.26
          solc --version
          slither --version

      - name: Analyze InspectEscrowPatch3
        shell: bash
        run: |
          set +e
          slither packages/phase3c_hardening_20261023/contracts/InspectEscrowPatch3.sol \
            --solc-remaps '@openzeppelin/=node_modules/@openzeppelin/' \
            --solc-args '--base-path . --include-path node_modules --optimize --optimize-runs 200 --via-ir' \
            --json .patch3-slither-escrow.json
          CODE=$?
          set -e
          test -f .patch3-slither-escrow.json || exit $CODE

      - name: Analyze CredentialRegistryPatch3
        shell: bash
        run: |
          set +e
          slither packages/phase3c_hardening_20261023/contracts/CredentialRegistryPatch3.sol \
            --solc-args '--base-path . --optimize --optimize-runs 200 --via-ir' \
            --json .patch3-slither-registry.json
          CODE=$?
          set -e
          test -f .patch3-slither-registry.json || exit $CODE

      - name: Gate untriaged High and Medium project findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary={}
          blocking=[]
          dependency_findings=[]
          triaged_project_false_positives=[]

          for file in [Path('.patch3-slither-escrow.json'),Path('.patch3-slither-registry.json')]:
              data=json.loads(file.read_text())
              detectors=data.get('results',{}).get('detectors',[])
              counts={}
              for d in detectors:
                  impact=d.get('impact','Unknown')
                  check=d.get('check')
                  desc=d.get('description','')
                  counts[impact]=counts.get(impact,0)+1

                  if impact not in {'High','Medium'}:
                      continue

                  item={
                      'file':str(file),
                      'impact':impact,
                      'check':check,
                      'description':desc[:1400]
                  }

                  # Imported OpenZeppelin findings are retained in the report but are not
                  # treated as project-source vulnerabilities. The package/version is pinned.
                  if 'node_modules/@openzeppelin/' in desc:
                      item['triage']='PINNED_DEPENDENCY_FINDING'
                      dependency_findings.append(item)
                      continue

                  # Slither incorrect-equality is designed to catch fragile numeric/balance
                  # equality. Here it flags an enum branch that intentionally distinguishes
                  # ADMISSIBLE_PASS from ADMISSIBLE_REVIEW after the score-derived outcome
                  # has already been stored. This is exact finite-state control flow.
                  if (
                      check == 'incorrect-equality'
                      and '_routeAdmissible' in desc
                      and 'record.outcome == InspectionOutcome.ADMISSIBLE_PASS' in desc
                  ):
                      item['triage']='DOCUMENTED_ENUM_CONTROL_FLOW_FALSE_POSITIVE'
                      triaged_project_false_positives.append(item)
                      continue

                  blocking.append(item)

              summary[str(file)]=counts

          out={
              'summary':summary,
              'dependencyFindings':dependency_findings,
              'triagedProjectFalsePositives':triaged_project_false_positives,
              'blocking':blocking
          }
          Path('.patch3-slither-summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if blocking:
              raise SystemExit(f'{len(blocking)} untriaged High/Medium project finding(s)')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch3-slither-analysis
          path: |
            .patch3-slither-escrow.json
            .patch3-slither-registry.json
            .patch3-slither-summary.json
          include-hidden-files: true
          retention-days: 14
