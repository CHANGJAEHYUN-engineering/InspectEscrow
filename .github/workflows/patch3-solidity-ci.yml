name: PATCH3 Solidity CI

on:
  push:
    branches:
      - main
    paths:
      - 'packages/phase3c_hardening_20261023/contracts/**'
      - 'packages/phase3c_hardening_20261023/scripts/**'
      - 'packages/phase3c_hardening_20261023/test/**'
      - 'packages/phase3c_hardening_20261023/policy/**'
      - '.github/workflows/patch3-solidity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PATCH3 sources
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Solidity compiler and OpenZeppelin
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save solc@0.8.26 @openzeppelin/contracts@5.5.0 ethers@6.15.0

      - name: Syntax-check Sepolia finalization tooling
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/phase3c_hardening_20261023/scripts/validate-patch3-role-plan.mjs
          node --check packages/phase3c_hardening_20261023/scripts/deploy-patch3-sepolia.mjs
          node --check packages/phase3c_hardening_20261023/scripts/verify-patch3-deployment.mjs
          node --check packages/phase3c_hardening_20261023/scripts/build-patch3-policy-input.mjs
          node --check packages/phase3c_hardening_20261023/scripts/preflight-patch3-wallet.mjs

      - name: Compile PATCH3 contracts
        run: |
          node packages/phase3c_hardening_20261023/scripts/compile-patch3.mjs

      - name: Install Foundry 1.8.5
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Run hostile local-chain red-team
        shell: bash
        run: |
          set -euo pipefail
          anvil --host 127.0.0.1 --port 18546 --chain-id 31338 --accounts 20 --silent > /tmp/patch3-anvil.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill $ANVIL_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -s -X POST http://127.0.0.1:18546 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' | grep -q '"result"'; then
              break
            fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:18546 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}'
          node packages/phase3c_hardening_20261023/test/red-team-smoke.mjs
          node packages/phase3c_hardening_20261023/test/interop-golden.mjs
          python3 -m pip install --disable-pip-version-check --quiet pycryptodome==3.23.0
          python3 packages/phase3c_hardening_20261023/test/interop-golden.py
          node packages/phase3c_hardening_20261023/test/interface-freeze.mjs
          node packages/phase3c_hardening_20261023/test/policy-freeze-smoke.mjs

      - name: Structural hardening assertions
        shell: bash
        run: |
          set -euo pipefail
          SRC=packages/phase3c_hardening_20261023/contracts/InspectEscrowPatch3.sol
          grep -q 'PHASE2-PATCH3-CANDIDATE' "$SRC"
          grep -q 'primaryInspectorStation' "$SRC"
          grep -q 'backupInspectorStation' "$SRC"
          grep -q 'externalArbitratorStation' "$SRC"
          grep -q 'escalateToExternalArbitration' "$SRC"
          grep -q 'submitArbitrationDecision' "$SRC"
          grep -q 'executeFinalFallback' "$SRC"
          grep -q 'windows.mutualResolution' "$SRC"
          grep -q 'credentialRegistry.status' "$SRC"
          if grep -Eq 'function (registerCredential|suspendCredential|resumeCredential|revokeCredential)' "$SRC"; then
            echo 'FAIL: credential lifecycle management leaked back into escrow contract'
            exit 1
          fi
          if grep -q 'address inspectorStation;' "$SRC"; then
            echo 'FAIL: shared inspectorStation remains in TradeTerms'
            exit 1
          fi

      - name: Bytecode size report
        run: cat .patch3-build/PATCH3_COMPILE_MANIFEST.json

      - name: Upload compile outputs
        uses: actions/upload-artifact@v4
        with:
          name: patch3-solidity-compile
          path: .patch3-build/
          include-hidden-files: true
          retention-days: 14
